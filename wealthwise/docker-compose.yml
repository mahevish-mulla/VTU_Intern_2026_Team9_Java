version: '3.9'

services:

  # ── Spring Boot Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend          # folder containing your Spring Boot project
      dockerfile: Dockerfile
    container_name: wealthwise-backend
    restart: unless-stopped
    # Removed depends_on mysql because we are using Aiven Cloud
    environment:
      # Updated to your Aiven connection string
      SPRING_DATASOURCE_URL: jdbc:mysql://wealthwise-db-wealthwise1.e.aivencloud.com:11033/wealthwise_db1?sslmode=require
      SPRING_DATASOURCE_USERNAME: avnadmin
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-AVNS_RccSsX65cP6JjWWUR4j}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-wealthwise_secret_key_2026_minimum_32_chars_long}
      APP_JWT_EXPIRATION: 86400000
      # Mail
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Frontend CORS origin
      APP_FRONTEND_URL: http://localhost:3000
    ports:
      - "8081:8080"
    networks:
      - wealthwise-net

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend         # folder containing your React/Vite project
      dockerfile: Dockerfile
    container_name: wealthwise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - wealthwise-net

# ── Networks ────────────────────────────────────────────────────────────────────
networks:
  wealthwise-net:
    driver: bridge