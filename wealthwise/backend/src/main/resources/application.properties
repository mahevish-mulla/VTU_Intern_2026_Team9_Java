spring.application.name=DemiProjectWW
server.port=8080

# DATABASE - Defaults removed for security
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JWT - Secret must be provided by the environment
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# GMAIL SMTP - Credentials moved to environment variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# APP CORS
app.frontend.url=${APP_FRONTEND_URL:https://darling-sfogliatella-c22577.netlify.app}

# EXTERNAL API
mfapi.base.url=https://api.mfapi.in/mf
